version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: archive_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST API & Web UI (http://localhost:6333/dashboard)
      - "6334:6334" # gRPC API
    volumes:
      - ./qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__ENABLE_STATIC_CONTENT=1
